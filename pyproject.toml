[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-training-suite"
version = "0.1.0"
description = "Local cross-platform training suite with Email, Todo, and Calendar apps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "nicegui>=2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "shared*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["apps", "shared", "scripts"]
strict = true
warn_unused_configs = true
ignore_missing_imports = true
